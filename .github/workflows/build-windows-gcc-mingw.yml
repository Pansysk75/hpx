# Reusable workflow for configuring and building HPX on Windows with GCC/MinGW.

on:
    workflow_call:
        inputs:
            build-type:
                required: true
                type: string
            cmake-additional-options:
                required: false
                type: string
                default: ""
            build-targets:
                required: false
                type: string
                default: "all"
            test-regex:
                required: false
                type: string
                default: ".*"
            exclude-test-regex:
                required: false
                type: string
                default: ""

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - uses: jwlawson/actions-setup-cmake@v2.0

    - name: Install dependencies
      run: |
        choco install ninja -y
        md C:\projects
        $client = new-object System.Net.WebClient
        $client.DownloadFile("https://archives.boost.io/release/1.78.0/source/boost_1_78_0.7z","C:\projects\boost_1_78_0.7z")
        7z x C:\projects\boost_1_78_0.7z -y -oC:\projects\boost
        cd C:\projects\boost\boost_1_78_0
        .\bootstrap.bat gcc
        .\b2.exe `
            link=shared `
            variant=release `
            architecture=x86 `
            address-model=64 `
            threading=multi `
            --with-iostreams `
            --build-type=complete `
            install
        $client.DownloadFile("https://download.open-mpi.org/release/hwloc/v2.8/hwloc-win64-build-2.8.0.zip","C:\projects\hwloc-win64-build-2.8.0.zip")
        7z x C:\projects\hwloc-win64-build-2.8.0.zip -y -oC:\projects
    - name: Configure
      shell: bash
      run: |
          cmake . -Bbuild -G'Ninja' \
              -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \
              -DCMAKE_CXX_COMPILER=g++ \
              -DBOOST_ROOT="C:\Boost" \
              -DHWLOC_ROOT="C:\projects\hwloc-win64-build-2.8.0" \
              -DHPX_WITH_CXX_STANDARD=23 \
              -DHPX_WITH_STATIC_LINKING=ON \
              -DHPX_WITH_MALLOC=system \
              -DHPX_WITH_FETCH_ASIO=ON \
              -DHPX_WITH_PKGCONFIG=OFF \
              -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=2 \
              -DHPX_WITH_EXAMPLES=ON \
              -DHPX_WITH_TESTS=ON \
              -DHPX_WITH_TESTS_UNIT=ON \
              -DHPX_WITH_TESTS_EXAMPLES=ON \
              -DHPX_WITH_DEPRECATION_WARNINGS=OFF \
              -DHPX_WITH_MODULES_AS_STATIC_LIBRARIES=OFF \
              ${{ inputs.cmake-additional-options }}
    - name: Build
      shell: bash
      run: |
          cmake --build build --config ${{ inputs.build-type }} --target ${{ inputs.build-targets }} -- -j 2
    - name: Test
      shell: bash
      run: |
          EXCLUDE_REGEX=$(grep -v  -e ^# -e ^$ .github/workflows/excluded-tests-windows.txt | paste -sd'|')
          if [ -n "${{ inputs.exclude-test-regex }}" ]; then
            EXCLUDE_REGEX="${EXCLUDE_REGEX}|${{ inputs.exclude-test-regex }}"
          fi
          ctest \
            --test-dir build \
            --build-config ${{ inputs.build-type }} \
            --output-on-failure \
            --tests-regex "${{ inputs.test-regex }}" \
            --exclude-regex "${EXCLUDE_REGEX}"
