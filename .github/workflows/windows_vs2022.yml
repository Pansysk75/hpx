name: Windows CI (VS2022 toolset)

on: [pull_request]

jobs:
  build-matrix:
    runs-on: windows-latest
    strategy:
      matrix:
        build-type: [Debug, Release]
        with-fetch-deps: [ON, OFF]
        with-cxx-modules: [ON, OFF]
        with-static-linking: [ON, OFF]
        include:
            - build-type: Debug
              additional-options: "-DHPX_COROUTINES_WITH_SWAP_CONTEXT_EMULATION=ON -DHPX_WITH_VERIFY_LOCKS=ON -DHPX_WITH_VERIFY_LOCKS_BACKTRACE=ON"
            - build-type: Release
              additional-options: ""
    name: |
        ${{ matrix.build-type }} - \
        ${{ matrix.with-fetch-deps == 'ON' && 'fetch-deps ' || '' }} \
        ${{ matrix.with-cxx-modules == 'ON' && 'cxx-modules ' || '' }} \
        ${{ matrix.with-static-linking == 'ON' && 'static-linking' || '' }}

    steps:
    - uses: actions/checkout@v6
    - uses: jwlawson/actions-setup-cmake@v2.0

    - name: Install dependencies
      run: |
        md C:\projects
        $client = new-object System.Net.WebClient
        $client.DownloadFile("https://rostam.cct.lsu.edu/download/builder/vcpkg-export-hpx-dependencies-2024.7z","C:\projects\vcpkg-export-hpx-dependencies.7z")
        7z x C:\projects\vcpkg-export-hpx-dependencies.7z -y -oC:\projects\vcpkg
    - name: Configure
      shell: bash
      run: |
          cmake . -Bbuild -G'Visual Studio 17 2022' \
              -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
              -DCMAKE_TOOLCHAIN_FILE='C:/projects/vcpkg/scripts/buildsystems/vcpkg.cmake' \
              -DHPX_WITH_STATIC_LINKING=${{ matrix.with-static-linking }} \
              -DHPX_WITH_FETCH_ASIO=ON \
              -DHPX_WITH_FETCH_BOOST=${{ matrix.with-fetch-deps }} \
              -DHPX_WITH_FETCH_HWLOC=${{ matrix.with-fetch-deps }} \
              -DHPX_WITH_ASIO_TAG=asio-1-34-2 \
              -DHPX_WITH_EXAMPLES=ON \
              -DHPX_WITH_TESTS=ON \
              -DHPX_WITH_TESTS_EXAMPLES=ON \
              -DHPX_WITH_TESTS_UNIT=ON \
              -DHPX_WITH_DEPRECATION_WARNINGS=OFF \
              -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=2 \
              -DHPX_WITH_CHECK_MODULE_DEPENDENCIES=ON \
              -DHPX_WITH_CXX_MODULES=${{ matrix.with-cxx-modules }} \
              ${{ matrix.additional-options }} \
    - name: Build
      shell: bash
      run: |
          cmake --build build --config ${{ matrix.build-type }} \
          --target ALL_BUILD \
          -- -maxcpucount:2 -verbosity:minimal -nologo
    - name: Install
      shell: bash
      run: |
          cmake --install build --config ${{ matrix.build-type }}
    - name: Test
      run: |
          Set-Alias -Name grep -Value 'C:\Program Files\Git\usr\bin\grep.exe'
          Set-Alias -Name sed -Value 'C:\Program Files\Git\usr\bin\sed.exe'
          cd build
          ctest `
          --output-on-failure `
            --build-config ${{ matrix.build-type }} `
            --tests-regex tests.examples `
            --exclude-regex `
                 $(grep -v  -e ^# -e ^$ D:/a/hpx/hpx/.github/workflows/tests.examples.targets | sed ':b;N;$!bb;s/\n/|/g')
